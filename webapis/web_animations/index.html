<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Animations API</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .orb-stage {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
      position: relative;
    }
    .animated-orb {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 0%, #3b82f6 60%, transparent 100%);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/api-data.js"></script>
  <script src="../shared/ui-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
