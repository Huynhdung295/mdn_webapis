<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Window Controls Overlay API</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .custom-titlebar-frame {
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      overflow: hidden;
      background: #0f172a;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    .custom-titlebar {
      height: 40px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      user-select: none;
    }
    .titlebar-search-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.8rem;
      color: #94a3b8;
      width: 200px;
    }
    .os-window-buttons {
      display: flex;
      gap: 6px;
    }
    .win-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .win-close { background: #ef4444; }
    .win-min { background: #f59e0b; }
    .win-max { background: #10b981; }
    .simulated-app-body {
      padding: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/api-data.js"></script>
  <script src="../shared/ui-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
