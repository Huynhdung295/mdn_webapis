<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Properties and Values API</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Thẻ box có chuyển động gradient dựa trên biến CSS đã đăng ký */
    .animated-gradient-card {
      width: 100%;
      height: 140px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      background: linear-gradient(var(--gradient-angle, 0deg), var(--spot-color, #6366f1), #06b6d4, #8b5cf6);
      transition: --gradient-angle 0.8s ease, --spot-color 0.8s ease;
      margin-top: 12px;
    }

    .rotating-active {
      animation: rotateGradient 4s linear infinite;
    }

    @keyframes rotateGradient {
      0% { --gradient-angle: 0deg; }
      100% { --gradient-angle: 360deg; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="../shared/api-data.js"></script>
  <script src="../shared/ui-core.js"></script>
  <script src="script.js"></script>
</body>
</html>
